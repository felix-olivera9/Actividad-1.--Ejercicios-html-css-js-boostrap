<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 -Convertidor de Km a mi</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
</head>
<body>
    <div class="contenedor">
        <h1>Conversor de Kilometros a Millas</h1>

        <div class="grupo-formulario">
            <label for="kilometros">Kilometros (km):</label>
            <input type="text" id="kilometros" placeholder="Ej: 10">
        </div>

        <button type="button" id="btn-convertir">Convertir</button>

        <div class="grupo-formulario">
            <label for="millas">Millas (mi):</label>
            <input type="text" id="millas" readonly placeholder="Resultado">
        </div>

        <p id="error-msg" class="mensaje-error"></p>
    </div>

    <!-- Enlace al archivo Js -->
    <script src="js/ejercicio11.js"></script>
    
</body>
</html>
